function addDays(d,n){let x=parse(d);x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}

function explain(err){const m=String(err?.message||err||'').toLowerCase();if(/jwt|not authenticated|401|invalid claim|session/.test(m))return 'La sesión venció. Cierra sesión e ingresa de nuevo.';if(/permission|policy|403|42501/.test(m))return 'No tienes permiso para hacer esto. Revisa tu cuenta o la conexión con el hogar.';if(/unique|duplicate|23505/.test(m))return 'Esta tarea o registro ya existe.';if(/password.*weak|weak.*password|easy to guess/.test(m))return 'La contraseña es muy fácil de adivinar. Utiliza una nueva de al menos 12 caracteres, única y difícil de predecir.';if(/password.*short|at least|length/.test(m))return 'La contraseña debe tener al menos 12 caracteres.';if(/invalid login/.test(m))return 'Correo o contraseña incorrectos.';if(/email not confirmed|not confirmed/.test(m))return 'Confirma tu correo desde el mensaje de bienvenida.';if(/rate limit|too many|429/.test(m))return 'Se realizaron demasiados intentos. Prueba más tarde.';if(/fetch|network|connection|timeout/.test(m))return 'No hay conexión con la base de datos. Revisa internet e inténtalo otra vez.';return err?.message?`No se pudo completar: ${err.message}`:'Ocurrió un error. Intenta nuevamente.'}
function check({error,data},fallback='Error'){if(error)throw error;return data}

async function hydrate(){
 if(!sb){root.innerHTML=`<main class="setup"><div class="card">${iconTitle('🏡','Misión Casa')}<h1 class="title">Falta conectar la base de datos</h1><p class="sub">Configura las variables VITE_SUPABASE_URL y VITE_SUPABASE_PUBLISHABLE_KEY en Vercel para conectar tus cuentas y el hogar existente. Consulta README.md.</p></div></main>`;return;}
 try{
  const u=await sb.auth.getUser(); if(u.error && !/session missing/i.test(u.error.message)) throw u.error;
  state.user=u.data?.user||null;
  if(state.user){await fetchHome()}else{state.home=null;state.members=[];state.chores=[];state.occ=[];state.proposals=[];state.availability=[];state.steps=[];state.checks=[];state.reviews=[];}
  state.ready=true;connectLive();draw();
 }catch(e){state.ready=true;root.innerHTML=`<main class="setup"><div class="card"><h1>Error al conectar</h1><p>${esc(explain(e))}</p><button class="btn" data-act="retry">Reintentar</button></div></main>`;}
}
async function fetchHome(){
 const userId=state.user.id;
 const memberships=check(await sb.from('memberships').select('household_id,joined_at').eq('user_id',userId).order('joined_at',{ascending:true}).limit(1));
 const hid=memberships?.[0]?.household_id;
 if(!hid){state.home=null;state.members=[];state.chores=[];state.occ=[];state.proposals=[];state.availability=[];state.steps=[];state.checks=[];state.reviews=[];return;}
 const after=addDays(today(),-130);
 const res=await Promise.all([
  sb.from('households').select('*').eq('id',hid).single(),
  sb.from('memberships').select('user_id,joined_at').eq('household_id',hid).order('joined_at'),
  sb.from('chores').select('*').eq('household_id',hid).order('created_at'),
  sb.from('occurrences').select('*').eq('household_id',hid).gte('occ_date',after),
  sb.from('notes').select('*').eq('household_id',hid).order('created_at',{ascending:false}).limit(20),
  sb.from('activity').select('*').eq('household_id',hid).order('created_at',{ascending:false}).limit(30),
   sb.from('proposals').select('*').eq('household_id',hid).order('created_at',{ascending:false}).limit(60),
  sb.from('member_availability').select('*').eq('household_id',hid),
  sb.from('weekly_reviews').select('*').eq('household_id',hid).gte('week_start',addDays(today(),-110))
 ]);
 for(const r of res)if(r.error)throw r.error;
 const [home,mem,chores,occ,notes,activity,proposals,availability,reviews]=res.map(x=>x.data);
 const ids=mem.map(x=>x.user_id);
 const profiles=ids.length?check(await sb.from('profiles').select('id,display_name,emoji').in('id',ids)):[];
 state.home=home;state.members=mem.map(x=>({...x,...profiles.find(p=>p.id===x.user_id),id:x.user_id,display_name:profiles.find(p=>p.id===x.user_id)?.display_name||'Integrante'}));
 state.chores=chores;state.occ=occ;state.notes=notes;state.activity=activity;state.proposals=proposals||[];state.availability=availability||[];state.reviews=reviews||[];
 const choreIds=chores.map(c=>c.id);
 const stepsRes=choreIds.length?await sb.from('chore_steps').select('*').in('chore_id',choreIds).order('sort_order'): {data:[],error:null};
 if(stepsRes.error)throw stepsRes.error;
 state.steps=stepsRes.data||[];
 const stepIds=state.steps.map(s=>s.id);
 const checksRes=stepIds.length?await sb.from('step_checks').select('*').in('step_id',stepIds).gte('occ_date',after):{data:[],error:null};
 if(checksRes.error)throw checksRes.error;
 state.checks=checksRes.data||[];
 applyPendingToState();
}

function dailyStreak(){let count=0,d=today();for(let i=0;i<120;i++){const arr=agenda(state.chores,state.occ,d,state.members);if(!arr.length){d=addDays(d,-1);continue}if(arr.every(x=>isDone(x.occ))){count++;d=addDays(d,-1);continue}if(i===0){d=addDays(d,-1);continue}break}return count}

// Misión Casa 3: assistant operates locally on real persisted chores, not an external generative AI.
// It never changes household assignments without an explicit proposal and approval.
const taskWeight=c=>Math.round(Number(c.minutes||0)*({1:1,2:1.25,3:1.5}[Number(c.difficulty)]||1));
function summaryWeek(day=today()){
 const schedule=weekDays(day),planned=Object.fromEntries(state.members.map(m=>[m.id,{minutes:0,effort:0,count:0}])),actual=Object.fromEntries(state.members.map(m=>[m.id,{minutes:0,effort:0,count:0}]));
 for(const d of schedule){for(const item of agenda(state.chores,state.occ,d,state.members)){
  const owner=item.assignee;if(owner&&planned[owner]){planned[owner].minutes+=Number(item.chore.minutes||0);planned[owner].effort+=taskWeight(item.chore);planned[owner].count++}
 }}
 for(const o of state.occ){if(!isDone(o)||!schedule.includes(o.occ_date)||!actual[o.completed_by])continue;
  const chore=taskById(o.chore_id);actual[o.completed_by].minutes+=Number(o.minutes||0);
  actual[o.completed_by].effort+=chore?Math.round(Number(o.minutes||0)*({1:1,2:1.25,3:1.5}[Number(chore.difficulty)]||1)):Number(o.minutes||0);
  actual[o.completed_by].count++;
 }
 return {planned,actual,schedule};
}
function availFor(id,d,time){
 const m=state.availability.find(a=>a.user_id===id&&a.weekday===dayOf(d));
 if(!m)return false;
 const start=String(m.available_from).slice(0,5),end=String(m.available_until).slice(0,5);
 return !time||(String(time).slice(0,5)>=start&&String(time).slice(0,5)<end);
}
function hasWeekAvailability(id,ch,dates){const ds=dates.filter(d=>happens(ch,d));return ds.length>0&&ds.every(d=>availFor(id,d,ch.due_time));}

function assistantSuggestions(){
 if(state.members.length<2)return [];
 const {planned}=summaryWeek();const load=Object.fromEntries(state.members.map(m=>[m.id,planned[m.id].effort]));
 const weeks=weekDays(today()), pending=state.chores.filter(c=>c.active&&c.assignee_id&&state.members.some(m=>m.id===c.assignee_id)&&weeks.some(d=>happens(c,d)));
 const ranked=pending.map(c=>({chore:c,cost:weeks.filter(d=>happens(c,d)).length*taskWeight(c)})).sort((a,b)=>b.cost-a.cost);
 const capacity=id=>state.availability.filter(a=>a.user_id===id).reduce((sum,a)=>{const convert=t=>{const [h,m]=String(t).slice(0,5).split(':').map(Number);return h*60+m};return sum+Math.max(0,convert(a.available_until)-convert(a.available_from))},0);
 const result=[];
 for(const {chore,cost} of ranked){const owner=chore.assignee_id,target=state.members.filter(m=>m.id!==owner).filter(m=>{const configured=state.availability.some(a=>a.user_id===m.id);return !configured||(hasWeekAvailability(m.id,chore,weeks)&&capacity(m.id)>=cost);}).sort((a,b)=>{const ca=capacity(a.id),cb=capacity(b.id);const scoreA=ca?load[a.id]/ca:load[a.id]/180;const scoreB=cb?load[b.id]/cb:load[b.id]/180;return scoreA-scoreB})[0];
  if(!target || result.some(x=>x.chore.id===chore.id) || state.proposals.some(p=>p.chore_id===chore.id&&p.status==='pending'))continue;
  const before=Math.abs(load[owner]-load[target.id]),after=Math.abs((load[owner]-cost)-(load[target.id]+cost));
  if(after+5<before && load[owner]>load[target.id]){result.push({chore,target,minutes:cost,before,after});load[owner]-=cost;load[target.id]+=cost}
  if(result.length>=3)break;
 }
 return result;
}

function assistantPanel(){const week=summaryWeek(),suggestions=assistantSuggestions();const vals=state.members.map(m=>week.planned[m.id]?.effort||0);const gap=vals.length>1?Math.max(...vals)-Math.min(...vals):0;

// Misión Casa 5.0: cola local limitada. Solo se almacena ID de tarea/paso, fecha y tipo;
// nunca contraseñas, tokens ni datos de otras personas. Los cambios son monotónicos
// (completar, no deshacer), y se respeta una finalización previa en el servidor.
function queueStoreKey(){return state.user&&state.home?`mc.v5.pending.${state.user.id}.${state.home.id}`:null}
function pendingQueue(){const key=queueStoreKey();if(!key)return [];try{const arr=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(arr)?arr.filter(x=>x&&['task_done','step_complete'].includes(x.kind)&&/^\d{4}-\d\d-\d\d$/.test(x.date)&&Date.now()-Number(x.at||0)<30*86400000).slice(0,60):[]}catch{return []}}
function saveQueue(arr){const key=queueStoreKey();if(key)localStorage.setItem(key,JSON.stringify(arr))}
function offlineQueueAdd(op){if(!state.user||!state.home)return;const arr=pendingQueue();if(arr.length>=60){notify('La lista de tareas pendientes de sincronizar está llena. Conéctate para enviar los cambios.',true);return false;}const id=op.kind==='task_done'?op.chore_id:op.step_id;const record={...op,at:Date.now()};if(!arr.some(x=>x.kind===op.kind&&x.date===op.date&&(x.chore_id||x.step_id)===id))arr.push(record);saveQueue(arr);return true}
function applyPendingToState(){for(const q of pendingQueue()){if(q.kind==='task_done'){const c=state.chores.find(x=>x.id===q.chore_id);if(!c)continue;const previous=state.occ.find(o=>o.chore_id===c.id&&o.occ_date===q.date);if(!previous||previous.status!=='done'){state.occ=state.occ.filter(o=>!(o.chore_id===c.id&&o.occ_date===q.date));state.occ.push({chore_id:c.id,household_id:state.home.id,occ_date:q.date,status:'done',completed_by:state.user.id,completed_at:new Date(q.at).toISOString(),minutes:c.minutes,xp:xp(c),offline:true})}}else if(q.kind==='step_complete'&&state.steps.some(x=>x.id===q.step_id)&&!state.checks.some(c=>c.step_id===q.step_id&&c.occ_date===q.date)){state.checks.push({step_id:q.step_id,occ_date:q.date,completed_by:state.user.id,offline:true})}}}
function offlineBanner(){const n=pendingQueue().length,online=navigator.onLine;return (!online||n)?`<div class="connection-banner" role="status"><strong>${online?'🔁 Cambios por sincronizar':'📴 Sin conexión'}</strong><span>${n} cambio(s) pendiente(s). ${online?'Vuelve a enviar tus cambios.':'Puedes marcar tareas y pasos, sin cerrar esta pantalla.'}</span>${online?'<button class="btn small" data-act="syncQueue">Sincronizar</button>':''}</div>`:''}
async function flushQueue(){if(!navigator.onLine||state.syncing||!state.user||!state.home||state.busy)return;const existing=pendingQueue();if(!existing.length)return;state.syncing=true;let completed=0;try{
 const u=await sb.auth.getUser();if(!u.data?.user||u.data.user.id!==state.user.id)throw new Error('La sesión cambió; inicia sesión otra vez para sincronizar.');
 for(const op of existing){if(!navigator.onLine)break;try{
  if(op.kind==='task_done'){
   const c=state.chores.find(x=>x.id===op.chore_id);if(!c)throw new Error('Tarea eliminada; se requiere revisión');
   const remote=check(await sb.from('occurrences').select('status').eq('household_id',state.home.id).eq('chore_id',c.id).eq('occ_date',op.date).maybeSingle());
   if(remote?.status!=='done'){check(await sb.from('occurrences').upsert({household_id:state.home.id,chore_id:c.id,occ_date:op.date,status:'done',completed_by:state.user.id,completed_at:new Date(op.at).toISOString(),minutes:c.minutes,xp:xp(c),updated_at:new Date().toISOString()},{onConflict:'chore_id,occ_date'}));}
  }else{
   if(!state.steps.some(x=>x.id===op.step_id))throw new Error('Paso eliminado; se requiere revisión');
   const remote=check(await sb.from('step_checks').select('step_id').eq('step_id',op.step_id).eq('occ_date',op.date).maybeSingle());
   if(!remote){const result=await sb.from('step_checks').insert({step_id:op.step_id,occ_date:op.date,completed_by:state.user.id});if(result.error&&result.error.code!=='23505')throw result.error;}
  }
  const current=pendingQueue();saveQueue(current.filter(x=>!(x.kind===op.kind&&x.date===op.date&&x.chore_id===op.chore_id&&x.step_id===op.step_id)));completed++;
 }catch(e){console.warn('Pendiente de sincronizar: ',e);break;}
 }
 if(completed){await fetchHome();draw();notify(`${completed} cambio(s) sincronizado(s) con el hogar 💛`)}
 }catch(e){notify(explain(e),true)}finally{state.syncing=false;}
}
function reportMetrics(date){const weeks=weekDays(date),plan=summaryWeek(date),all=weeks.flatMap(d=>agenda(state.chores,state.occ,d,state.members));const total=all.length,doneItems=all.filter(a=>isDone(a.occ));const late=all.filter(a=>a.day<today()&&!isDone(a.occ));const categories=Object.fromEntries(CATEGORIES.map(([x])=>[x,{planned:0,done:0,minutes:0}]));for(const row of all){const o=categories[row.chore.category]||categories.Otros;o.planned++;if(isDone(row.occ)){o.done++;o.minutes+=Number(row.occ?.minutes||row.chore.minutes||0)}}return{weeks,plan,total,doneItems,late,categories,rate:total?Math.round(doneItems.length*100/total):0}}
function reportPage(){const date=state.reportDate||today(),m=reportMetrics(date),prev=reportMetrics(addDays(date,-7));const difference=m.rate-prev.rate;return `<div class="eyebrow">Revisión de avances</div><h1 class="title">📊 Informe semanal</h1><p class="sub">Datos reales de tareas compartidas, sin competir ni asignar culpas. Los tiempos son estimaciones.</p><div class="card print-hide"><div class="between"><button class="btn secondary small" data-act="reportPrev">‹ Semana anterior</button><strong>${esc(dayName(m.weeks[0]))} – ${esc(dayName(m.weeks[6]))}</strong><button class="btn secondary small" data-act="reportNext">Siguiente ›</button></div></div><div class="cards2"><div class="metric"><span>✅ Completadas</span><strong>${m.doneItems.length}/${m.total}</strong><small>${m.rate}% del total</small></div><div class="metric"><span>🕒 Pendientes atrasadas</span><strong>${m.late.length}</strong><small>Hasta hoy</small></div></div><div class="card"><h2>👫 Contribuciones de la semana</h2>${state.members.map(member=>{const actual=m.plan.actual[member.id],planned=m.plan.planned[member.id];return `<div class="report-member"><strong>${esc(member.display_name)}</strong><div class="between"><span>Planificadas: ${planned.minutes} min</span><span>Realizadas: ${actual.minutes} min</span></div><div class="progressline"><div class="fill" style="width:${Math.min(100,Math.round(100*actual.minutes/Math.max(1,planned.minutes)))}%"></div></div></div>`}).join('')}<p class="hint">Un mayor porcentaje no significa que alguien trabaje más fuera del hogar.</p></div><div class="card"><h2>🧽 Avance por ambiente</h2>${Object.entries(m.categories).filter(([,v])=>v.planned).map(([cat,v])=>`<div class="report-member"><div class="between"><strong>${emoji(cat)} ${esc(cat)}</strong><span>${v.done} de ${v.planned}</span></div><div class="progressline"><div class="fill" style="width:${Math.round(100*v.done/v.planned)}%"></div></div></div>`).join('')||'<p class="hint">Aún no hay tareas programadas.</p>'}</div><div class="card"><h2>💡 Sugerencias para la próxima semana</h2><p>${m.late.length?`Hay ${m.late.length} tarea(s) de días anteriores pendientes. Revisen juntos si siguen siendo necesarias o necesitan otra fecha.`:'Van al día con las tareas programadas anteriormente.'}</p><p>${difference>0?`Mejoraron ${difference} puntos porcentuales respecto de la semana pasada.`:difference<0?`El avance fue ${Math.abs(difference)} puntos menor que la semana anterior; revisen la disponibilidad.`:'Sin variación porcentual respecto de la semana anterior.'}</p><p>Las propuestas de reparto inteligente siempre requieren aprobación de tu pareja.</p><div class="quick-actions print-hide"><button class="btn" data-act="tab" data-tab="semana">✨ Revisar planificador</button><button class="btn secondary" data-act="tab" data-tab="nosotros">💛 Reunión semanal</button><button class="btn secondary" data-act="reportPrint">Imprimir o guardar PDF</button></div></div>`}

function draw(){if(!state.user){authPage();return}if(!state.home){onboarding();return}const page={hoy:todayPage,semana:weekPage,nueva:formPage,retos:retosPage,nosotros:nosotrosPage,ajustes:ajustesPage,reporte:reportPage,pasos:stepsPage}[state.tab]||todayPage;root.innerHTML=wrap(page());}
function taskById(id){return state.chores.find(t=>t.id===id)}
function setTab(tab){state.tab=tab;if(tab!=='nueva'){state.editing=null;state.template=null}draw();window.scrollTo({top:0,behavior:'smooth'})}
root.addEventListener('change',e=>{if(e.target.name==='recurrence'){const week=document.querySelector('#weekdays');if(week)week.hidden=e.target.value!=='weekdays'}});
root.addEventListener('click',async e=>{
 const btn=e.target.closest('[data-act]');if(!btn)return;
 const a=btn.dataset.act,id=btn.dataset.id,day=btn.dataset.date;
 if(a==='openSteps'){state.stepChore=id;state.stepDay=day||today();state.tab='pasos';draw();return;}
 if(a==='toggleStep'){
  const step=state.steps.find(s=>s.id===id);if(!step)return;
  if(!navigator.onLine){if(checkedStep(id,day)){notify('Por seguridad, desmarcar pasos requiere conexión. No se perderán cambios anteriores.',true);return;}if(!offlineQueueAdd({kind:'step_complete',step_id:id,date:day}))return;state.checks.push({step_id:id,occ_date:day,completed_by:state.user.id,offline:true});draw();notify('Paso marcado en este iPhone. Se sincronizará cuando vuelva internet.');return;}
  await action(async()=>{if(checkedStep(id,day)){check(await sb.from('step_checks').delete().eq('step_id',id).eq('occ_date',day));}else{check(await sb.from('step_checks').insert({step_id:id,occ_date:day,completed_by:state.user.id}));}},'Paso actualizado ☑️');return;
 }
 if(a==='removeStep'){
  const step=state.steps.find(s=>s.id===id);if(!step||!confirm('¿Quitar este paso del checklist? Se borrarán sus marcas anteriores.'))return;
  await action(async()=>{check(await sb.from('chore_steps').delete().eq('id',id));},'Paso eliminado');return;
 }
 if(a==='reviewPrev'||a==='reviewNext'){state.reviewWeek=addDays(state.reviewWeek,a==='reviewPrev'?-7:7);draw();return;}
 if(a==='retry'){loading();await hydrate();return;}
 if(a==='syncQueue'){await flushQueue();return;}
 if(a==='reportPrev'){state.reportDate=addDays(state.reportDate||today(),-7);draw();return;}
 if(a==='reportNext'){state.reportDate=addDays(state.reportDate||today(),7);draw();return;}
 if(a==='reportPrint'){window.print();return;}
 if(a==='pushEnable'){await enablePush();return;}
 if(a==='pushDisable'){await disablePush();return;}
 if(a==='authMode'){state.authMode=btn.dataset.mode;draw();return;}
 if(a==='tab'){setTab(btn.dataset.tab);return;}
 if(a==='new'){state.editing=null;state.template=null;setTab('nueva');return;}
 if(a==='edit'){state.editing=taskById(id);state.template=null;state.tab='nueva';draw();return;}
 if(a==='template'){state.template=Number(btn.dataset.idx);state.editing=null;draw();return;}
 if(a==='date'){state.date=day;draw();return;}
 if(a==='weekPrev'||a==='weekNext'){state.date=addDays(state.date,a==='weekPrev'?-7:7);draw();return;}
 if(a==='weekNow'){state.date=today();draw();return;}
 if(a==='logout'){await action(async()=>{check(await sb.auth.signOut());state.user=null;state.home=null;state.authMode='login';},'Sesión cerrada');return;}
 if(a==='propose'){
  const c=taskById(id);if(!c||state.members.length<2){notify('Invita a tu pareja para proponer cambios.',true);return;}
  if(pendingProposals().some(p=>p.chore_id===c.id)){notify('Esta tarea ya tiene una solicitud pendiente.');return;}
  const newOwner=btn.dataset.target?state.members.find(m=>m.id===btn.dataset.target):partnerFor(c);
  if(!newOwner||newOwner.id===c.assignee_id){notify('No se encontró otro responsable.',true);return;}
  const oldName=nameOf(c.assignee_id);const msg=`¿Proponer cambiar «${c.title}» de ${oldName} a ${newOwner.display_name}? Si la pareja acepta, afectará a todas las próximas repeticiones de esta tarea.`;
  if(!confirm(msg))return;
  await action(async()=>{
   check(await sb.from('proposals').insert({household_id:state.home.id,chore_id:c.id,from_user:state.user.id,new_assignee:newOwner.id,reason:'Propuesta de reparto equitativo',status:'pending'}));
   await sb.from('activity').insert({household_id:state.home.id,actor_id:state.user.id,kind:'proposal_new',message:'propuso cambiar el responsable de «'+c.title+'»'});
  },'Solicitud enviada a tu pareja 💛');return;
 }
 if(a==='respondProposal'){
  const p=state.proposals.find(x=>x.id===id);if(!p||p.status!=='pending'||p.from_user===state.user.id)return;
  const accepted=btn.dataset.accept==='true';
  const c=taskById(p.chore_id);
  if(!confirm((accepted?'Aceptar':'Rechazar')+' el cambio de «'+(c?.title||'tarea')+'»?'+(accepted?' Afectará las próximas repeticiones.':'')))return;
  await action(async()=>{check(await sb.rpc('respond_proposal',{_id:p.id,_accept:accepted}));},accepted?'Cambio aprobado ✅':'Cambio rechazado');return;
 }
 if(a==='calendarExport'){
  const c=buildCalendar();if(!c.count){notify('No tienes tareas pendientes asignadas para los próximos 14 días.',true);return;}
  const blob=new Blob([c.text],{type:'text/calendar;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='Mision-Casa-Avisos.ics';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);
  notify(c.count+' eventos preparados. Abre el archivo desde Archivos y añádelo a Calendario.');return;
 }
 if(a==='foregroundAlerts'){state.remindForeground=!state.remindForeground;localStorage.setItem('mision.remindForeground',state.remindForeground?'yes':'no');draw();notify(state.remindForeground?'Avisos habilitados mientras uses la app.':'Avisos de pantalla desactivados.');return;}
 if(a==='notificationPermission'){
  if(!('Notification'in window)){notify('Este navegador no permite estas notificaciones.',true);return;}
  try{const p=await Notification.requestPermission();draw();notify(p==='granted'?'Permiso concedido. Se mostrarán avisos mientras esté abierta la app.':'No se concedió el permiso. Puedes utilizar Calendario.')}catch{notify('No fue posible solicitar permiso. Utiliza el Calendario.',true)}return;
 }
 if(a==='quickThanks'){
  const partner=state.members.find(m=>m.id!==state.user.id);
  if(!partner)return;
  const messages=['Gracias por tu ayuda hoy. ¡Hacemos un buen equipo! 💛','Me encantó que compartiéramos las tareas. 🌱','Gracias por tu esfuerzo; lo valoro mucho. ✨'];
  const idx=Math.min(2,Math.max(0,Number(btn.dataset.msg)||0));
  await action(async()=>{check(await sb.from('activity').insert({household_id:state.home.id,actor_id:state.user.id,to_user:partner.id,kind:'thanks',message:messages[idx]}));},'Mensaje de cariño enviado 💌');return;
 }
 if(a==='share'){const invite=`Únete a nuestro hogar en Misión Casa 🏡\nCódigo: ${state.home.invite_code}\nAbre la app y elige «Unirme con un código».`;if(navigator.share){try{await navigator.share({title:'Misión Casa',text:invite,url:APP_URL})}catch{}}else if(navigator.clipboard){try{await navigator.clipboard.writeText(invite+'\n'+APP_URL);notify('Invitación copiada para compartir 💛')}catch{notify(invite)}}else notify(invite);return;}
 if(a==='roulette'){
  const items=agenda(state.chores,state.occ,today(),state.members).filter(i=>!isDone(i.occ));if(!items.length||state.spin)return;state.spin=true;btn.disabled=true;
  const output=document.querySelector('#roulette-out');let count=0;const iterations=19;
  const run=()=>{if(!output){state.spin=false;return}const selected=items[Math.floor(Math.random()*items.length)];output.textContent='🎲 '+selected.chore.title;output.classList.add('rolling');count++;if(count>=iterations){state.spin=false;state.highlight={id:selected.chore.id,title:selected.chore.title};output.classList.remove('rolling');draw();return}setTimeout(run,75+count*9)};run();return;
 }
 if(a==='goSelected'){const chosen=state.highlight?.id;state.tab='hoy';draw();if(chosen){const node=document.getElementById('task-'+chosen);node?.scrollIntoView({behavior:'smooth',block:'center'});node?.classList.add('task-highlight');setTimeout(()=>node?.classList.remove('task-highlight'),2300)}return;}
 if(a==='duration'){if(state.timerRunning)return;state.timerDuration=Number(btn.dataset.seconds)||900;state.timerSec=state.timerDuration;draw();return;}
 if(a==='timerPlay'){if(state.timerRunning){refreshTimer();state.timerRunning=false;}else{if(state.timerSec<=0)state.timerSec=state.timerDuration;state.timerEndsAt=Date.now()+state.timerSec*1000;state.timerRunning=true;}draw();return;}
 if(a==='timerReset'){state.timerRunning=false;state.timerSec=state.timerDuration;draw();return;}
 if(a==='delete'){const c=taskById(id);if(!c||!confirm(`¿Eliminar la tarea «${c.title}» y su historial? Esta acción no se puede deshacer.`))return;await action(async()=>{check(await sb.from('chores').delete().eq('id',c.id).eq('household_id',state.home.id));state.tab='hoy';state.editing=null;},'Tarea eliminada');return;}
 if(['start','done','undo'].includes(a)){
  const c=taskById(id);if(!c)return;
  if(!navigator.onLine){if(a!=='done'){notify('Sin conexión solo puedes marcar tareas completadas. Los cambios de estado necesitan internet.',true);return;}if(isDone(state.occ.find(o=>o.chore_id===id&&o.occ_date===day))){notify('Esta tarea ya está lista.');return;}if(!offlineQueueAdd({kind:'task_done',chore_id:id,date:day}))return;const item={household_id:state.home.id,chore_id:id,occ_date:day,status:'done',completed_by:state.user.id,completed_at:new Date().toISOString(),minutes:c.minutes,xp:xp(c),offline:true};state.occ=state.occ.filter(o=>!(o.chore_id===id&&o.occ_date===day));state.occ.push(item);draw();notify('Tarea guardada sin conexión. Se sincronizará al volver internet.');return;}
  const succeeded=await action(async()=>{
   if(a==='undo'){check(await sb.from('occurrences').delete().eq('chore_id',c.id).eq('occ_date',day).eq('household_id',state.home.id));return;}
   const payload={household_id:state.home.id,chore_id:c.id,occ_date:day,updated_at:new Date().toISOString()};
   if(a==='start'){Object.assign(payload,{status:'in_progress',started_by:state.user.id});}
   if(a==='done'){Object.assign(payload,{status:'done',completed_by:state.user.id,completed_at:new Date().toISOString(),minutes:c.minutes,xp:xp(c)});}
   check(await sb.from('occurrences').upsert(payload,{onConflict:'chore_id,occ_date'}));
   if(a==='done')await sb.from('activity').insert({household_id:state.home.id,actor_id:state.user.id,kind:'done',message:`completó «${c.title}»`});
  },a==='done'?'¡Bien hecho! 💛':a==='undo'?'La tarea vuelve a pendiente':'¡Manos a la obra!');if(succeeded&&a==='done')launchConfetti();return;
 }
});
root.addEventListener('submit',async e=>{
 const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const f=new FormData(form),kind=form.dataset.form;
 if(kind==='auth'){
  const email=String(f.get('email')).trim(),password=String(f.get('password')||'');
  if(kind==='auth'&&state.authMode==='signup'&&password.length<12){notify('Elige una contraseña nueva de al menos 12 caracteres.',true);return;}
  await action(async()=>{
   if(state.authMode==='login'){check(await sb.auth.signInWithPassword({email,password}));state.user=(await sb.auth.getUser()).data.user;await fetchHome();return;}
   if(state.authMode==='signup'){const ret=await sb.auth.signUp({email,password,options:{data:{display_name:String(f.get('name')||'').trim()},emailRedirectTo:APP_URL}});check(ret);if(ret.data.session){state.user=ret.data.user;await fetchHome();}else notify('Cuenta creada. Revisa tu correo y confirma tu dirección antes de entrar.');return;}
   check(await sb.auth.resetPasswordForEmail(email,{redirectTo:APP_URL}));notify('Revisa tu correo para recuperar tu contraseña.');
  });return;
 }
 if(kind==='createhome'||kind==='joinhome'){
  await action(async()=>{check(await sb.rpc(kind==='createhome'?'create_household':'join_household',kind==='createhome'?{_name:String(f.get('name')).trim()}:{_code:String(f.get('code')).trim().toUpperCase()}));},kind==='createhome'?'¡Hogar creado! 🏡':'¡Te uniste al hogar! 💛');return;
 }
 if(kind==='task'){
  const title=String(f.get('title')||'').trim(),minutes=Number(f.get('minutes')),recur=String(f.get('recurrence'));
  const weekdays=f.getAll('weekday').map(Number);
  if(!title||!Number.isInteger(minutes)||minutes<1||minutes>480){notify('Completa el nombre y selecciona entre 1 y 480 minutos.',true);return;}
  if(recur==='weekdays'&&!weekdays.length){notify('Selecciona al menos un día de la semana.',true);return;}
  const data={household_id:state.home.id,title,description:String(f.get('description')||''),category:String(f.get('category')),minutes,difficulty:Number(f.get('difficulty')),priority:String(f.get('priority')),assignee_id:String(f.get('assignee')||'')||null,recurrence:recur,weekdays:recur==='weekdays'?weekdays:[],start_date:String(f.get('start_date')),due_time:String(f.get('due_time')||'')||null,active:true};
  await action(async()=>{if(state.editing){check(await sb.from('chores').update(data).eq('id',state.editing.id).eq('household_id',state.home.id));}else{check(await sb.from('chores').insert({...data,created_by:state.user.id}));}state.tab='hoy';state.template=null;state.editing=null;},state.editing?'Tarea actualizada':'¡Nueva tarea agregada! ✨');return;
 }
 if(kind==='availability'){
  const selected=f.getAll('day').map(Number);
  for(const d of selected){const from=String(f.get('from_'+d)||''),to=String(f.get('to_'+d)||'');if(!/^\d{2}:\d{2}$/.test(from)||!/^\d{2}:\d{2}$/.test(to)||from>=to){notify('Revisa el rango horario de '+['','lunes','martes','miércoles','jueves','viernes','sábado','domingo'][d]+'.',true);return;}}
  await action(async()=>{
   const old=state.availability.filter(x=>x.user_id===state.user.id);const obsolete=old.filter(x=>!selected.includes(x.weekday));
   for(const row of obsolete){check(await sb.from('member_availability').delete().eq('household_id',state.home.id).eq('user_id',state.user.id).eq('weekday',row.weekday));}
   if(selected.length){check(await sb.from('member_availability').upsert(selected.map(weekday=>({household_id:state.home.id,user_id:state.user.id,weekday,available_from:String(f.get('from_'+weekday)),available_until:String(f.get('to_'+weekday)),updated_at:new Date().toISOString()})),{onConflict:'household_id,user_id,weekday'}));}
  },'Mis horarios se guardaron para el hogar 💛');return;
 }
 if(kind==='stepAdd'){
  const chore=String(f.get('chore')||''),title=String(f.get('step')||'').trim();if(!state.chores.some(c=>c.id===chore)||!title||title.length>100){notify('El paso debe tener entre 1 y 100 caracteres.',true);return;}
  const steps=stepsFor(chore);if(steps.length>=20){notify('Máximo 20 pasos por tarea.',true);return;}
  await action(async()=>{check(await sb.from('chore_steps').insert({chore_id:chore,title,sort_order:steps.length}));},'Paso agregado ☑️');return;
 }
 if(kind==='weeklyReview'){
  const text=k=>String(f.get(k)||'').trim();const item={household_id:state.home.id,week_start:state.reviewWeek,user_id:state.user.id,celebration:text('celebration'),help_needed:text('help_needed'),commitment:text('commitment'),updated_at:new Date().toISOString()};
  if([item.celebration,item.help_needed,item.commitment].some(x=>x.length>350)){notify('Cada respuesta admite hasta 350 caracteres.',true);return;}
  await action(async()=>{check(await sb.from('weekly_reviews').upsert(item,{onConflict:'household_id,week_start,user_id'}));},'Revisión semanal compartida 💛');return;
 }
 if(kind==='home'){await action(async()=>{check(await sb.from('households').update({name:String(f.get('name')).trim(),agreement:String(f.get('agreement')).trim(),weekly_goal_xp:Number(f.get('goal'))}).eq('id',state.home.id))},'Ajustes guardados');return;}
 if(kind==='thanks'){await action(async()=>{check(await sb.from('activity').insert({household_id:state.home.id,actor_id:state.user.id,kind:'thanks',to_user:String(f.get('recipient')),message:String(f.get('message')).trim()}));},'Agradecimiento compartido 💛');return;}
 if(kind==='note'){await action(async()=>{check(await sb.from('notes').insert({household_id:state.home.id,author_id:state.user.id,body:String(f.get('note')).trim()}))},'Nota guardada para ambos');}
});
setInterval(()=>{if(state.timerRunning)refreshTimer()},300);
setInterval(()=>{if(state.user&&state.home&&document.visibilityState==='visible')refreshLive().catch(()=>{})},60000);
setInterval(()=>{if(state.user&&state.home)showAlerts()},15000);
if(sb){sb.auth.onAuthStateChange((_event,session)=>{const id=session?.user?.id||null;if(id!==state.user?.id&&state.ready){loading();Promise.resolve().then(hydrate);}});window.addEventListener('focus',()=>{if(state.user&&!state.busy)refreshLive().catch(()=>{})});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.user&&!state.busy)refreshLive().catch(()=>{})});}
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js?v=5').catch(e=>console.warn('SW no disponible',e));
window.addEventListener('offline',()=>{state.online=false;if(state.user&&state.home){draw();notify('Sin conexión. Podrás completar tareas y pasos; sincroniza cuando vuelva internet.')}});
window.addEventListener('online',()=>{state.online=true;if(state.user&&state.home){draw();flushQueue().catch(e=>console.warn('Sincronización pendiente',e));}});
setInterval(()=>{if(state.user&&state.home&&navigator.onLine&&pendingQueue().length&&!state.syncing)flushQueue().catch(()=>{});},30000);
loading();hydrate();

</script>
</body></html>
