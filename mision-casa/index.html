:20px}.authcard{width:100%;max-width:440px;background:#fffefa;border-radius:27px;padding:35px;box-shadow:0 14px 45px #54715711}.authcard h1{font-size:34px;margin:15px 0 10px}.authcard .field{margin-bottom:15px}.authcard .btn{margin-top:8px}.authlinks{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.toast{position:fixed;right:20px;top:20px;z-index:20;max-width:350px;padding:13px 18px;border-radius:14px;color:#3b4f40;background:#fff;border:1px solid #c5ddc9;box-shadow:0 9px 26px #284b2a28;font-weight:700}.toast.error{background:#ffebe8;border-color:#f1c9c4;color:#993f36}.bottomnav{display:none}.tag{display:inline-block;background:#e5eee4;border-radius:20px;padding:7px 12px;font-weight:800;font-size:13px;color:#48664f}.progressline{height:11px;overflow:hidden;border-radius:99px;background:#e7eadf}.progressline .fill{background:#6a9576;height:100%}.space{height:14px}.muted{color:#879187}.hint{font-size:12px;color:#849087;margin-top:6px}.dangertext{color:#a34a4a}.badgeRow{display:flex;gap:8px;flex-wrap:wrap}.badgeItem{border:1px solid #e2e5d9;padding:12px;border-radius:14px;background:#fbfcf8;opacity:.5}.badgeItem.earned{opacity:1;background:#e5eee4}.noteitem{border-left:3px solid #94ae94;padding:6px 10px;margin:10px 0;background:#f8faf6}.divider{height:1px;background:#e8ebe2;margin:23px 0}.tiny{font-size:13px}.setup{max-width:600px;margin:8vh auto;padding:24px}.spinner{animation:spin .85s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.page{padding:20px 15px 100px}.shell{grid-template-columns:1fr;gap:0}.nav{display:none}.topbar{margin-bottom:18px}.bottomnav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:0;border-top:1px solid #e4e7dc;background:#fffefaeb;backdrop-filter:blur(12px);padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:5}.bottomnav button{display:grid;gap:3px;justify-items:center;padding:5px 3px;min-width:0;flex:1;background:none;border:0;font-size:10px;color:#839085;font-weight:800}.bottomnav button .ico{font-size:20px}.bottomnav button.active{color:#4c7857}.hero{padding:21px}.sectionhead h2{font-size:20px}.task{flex-wrap:wrap}.taskbuttons{width:100%;justify-content:flex-end}.authcard{padding:25px}.card{padding:19px}.cards2{gap:9px}.metric{padding:15px}}@media(max-width:390px){.formgrid{grid-template-columns:1fr}.weekbar{gap:4px}.weekbar button{border-radius:10px;padding:10px 1px}.weekbar button b{font-size:14px}.weekbar button span{font-size:10px}}

<body>
<div id="app"><main class="loader">🏡 Cargando Misión Casa…</main></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm';
const CATEGORIES=[['Cocina','🍳'],['Baño','🛁'],['Dormitorio','🛏️'],['Living','🛋️'],['Ropa','👕'],['Pisos','🧹'],['Basura','🗑️'],['Otros','✨']];
const TEMPLATES=[['Lavar platos','Cocina',20,'daily',[1,2,3,4,5,6,7]],['Limpiar cocina','Cocina',25,'weekdays',[2,5]],['Barrer / aspirar','Pisos',20,'weekdays',[1,4]],['Trapear','Pisos',25,'weekly',[]],['Lavar baño','Baño',30,'weekly',[]],['Sacar basura','Basura',5,'weekdays',[1,3,5]],['Ordenar dormitorio','Dormitorio',15,'weekdays',[3,6]],['Lavar ropa','Ropa',15,'weekdays',[2,6]],['Doblar ropa','Ropa',20,'weekdays',[2,6]],['Limpiar refrigerador','Cocina',30,'monthly',[]]];
const DAY_SHORT=['L','M','M','J','V','S','D'];
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Santiago',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const parse=d=>new Date(`${d}T12:00:00Z`);
function addDays(d,n){let x=parse(d);x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function dayOf(d){let n=parse(d).getUTCDay();return n||7}
function weekStart(d){return addDays(d,1-dayOf(d))}
function weekDays(d){return Array.from({length:7},(_,i)=>addDays(weekStart(d),i))}
function happens(ch,d){if(!ch.active||d<ch.start_date)return false;switch(ch.recurrence){case 'daily':return true;case 'weekdays':return (ch.weekdays||[]).includes(dayOf(d));case 'weekly':return dayOf(ch.start_date)===dayOf(d);case 'once':return d===ch.start_date;case 'monthly':{const [y,m]=d.split('-').map(Number),last=new Date(Date.UTC(y,m,0)).getUTCDate();return Number(d.slice(8))===Math.min(Number(ch.start_date.slice(8)),last)}default:return false}}
function assignee(ch,date,members){if(ch.assignee_id)return ch.assignee_id;if(!members.length)return null;const weeks=Math.floor((parse(weekStart(date))-parse('2024-01-01'))/604800000);return members[((weeks%members.length)+members.length)%members.length].id}
function xp(ch){return 10+Math.round(ch.minutes/2)+Number(ch.difficulty)*5}
function agenda(chores,occ,day,members){const dict=new Map(occ.map(o=>[o.chore_id+'|'+o.occ_date,o]));return chores.filter(c=>happens(c,day)||dict.has(c.id+'|'+day)).map(c=>({chore:c,day,assignee:assignee(c,day,members),occ:dict.get(c.id+'|'+day)})).sort((a,b)=>(a.chore.due_time||'99').localeCompare(b.chore.due_time||'99'))}
const labelDay=d=>new Intl.DateTimeFormat('es-CL',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}).format(parse(d));


const BASE="https://lbglxcxdixxuvirdkmuc.supabase.co";
const KEY="sb_publishable_uWKlYTq2nw6Tvxnc9ibXMQ_gCWTomzd";
const sb=BASE&&KEY&&!BASE.includes('TU-PROYECTO')?createClient(BASE,KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const APP_URL=new URL('./',location.href).href;
const root=document.querySelector('#app');
const state={user:null,home:null,members:[],chores:[],occ:[],notes:[],activity:[],tab:'hoy',date:today(),editing:null,template:null,authMode:'login',busy:false,ready:false,express:false,highlight:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emoji=cat=>CATEGORIES.find(x=>x[0]===cat)?.[1]||'✨';
const nameOf=id=>id?(state.members.find(x=>x.id===id)?.display_name||'Integrante'):'Compartida';
const dayName=d=>labelDay(d).replace('.','');
const done=arr=>arr.filter(x=>x.occ?.status==='done');
const isDone=o=>o?.status==='done';
const chip=(n,v)=>`<span class="tag">${n} ${v}</span>`;
const iconTitle=(icon,title)=>`<div class="brand"><span class="brandicon">${icon}</span>${title}</div>`;
function notify(msg,error=false){let prev=document.querySelector('.toast');if(prev)prev.remove();const el=document.createElement('div');el.className='toast'+(error?' error':'');el.setAttribute('role','status');el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),5000)}
function explain(err){const m=String(err?.message||err||'').toLowerCase();if(/jwt|not authenticated|401|invalid claim|session/.test(m))return 'La sesión venció. Cierra sesión e ingresa de nuevo.';if(/permission|policy|403|42501/.test(m))return 'No tienes permiso para hacer esto. Revisa tu cuenta o la conexión con el hogar.';if(/unique|duplicate|23505/.test(m))return 'Esta tarea o registro ya existe.';if(/password.*weak|weak.*password|easy to guess/.test(m))return 'La contraseña es muy fácil de adivinar. Utiliza una nueva de al menos 12 caracteres, única y difícil de predecir.';if(/password.*short|at least|length/.test(m))return 'La contraseña debe tener al menos 12 caracteres.';if(/invalid login/.test(m))return 'Correo o contraseña incorrectos.';if(/email not confirmed|not confirmed/.test(m))return 'Confirma tu correo desde el mensaje de bienvenida.';if(/rate limit|too many|429/.test(m))return 'Se realizaron demasiados intentos. Prueba más tarde.';if(/fetch|network|connection|timeout/.test(m))return 'No hay conexión con la base de datos. Revisa internet e inténtalo otra vez.';return err?.message?`No se pudo completar: ${err.message}`:'Ocurrió un error. Intenta nuevamente.'}
function check({error,data},fallback='Error'){if(error)throw error;return data}
function loading(text='Cargando tu hogar…'){root.innerHTML=`<main class="loader">🏡 ${esc(text)}</main>`}

async function hydrate(){
 if(!sb){root.innerHTML=`<main class="setup"><div class="card">${iconTitle('🏡','Misión Casa')}<h1 class="title">Falta conectar la base de datos</h1><p class="sub">Configura las variables VITE_SUPABASE_URL y VITE_SUPABASE_PUBLISHABLE_KEY en Vercel para conectar tus cuentas y el hogar existente. Consulta README.md.</p></div></main>`;return;}
 try{
  const u=await sb.auth.getUser(); if(u.error && !/session missing/i.test(u.error.message)) throw u.error;
  state.user=u.data?.user||null;
  if(state.user){await fetchHome()}else{state.home=null;state.members=[];state.chores=[];state.occ=[];}
  state.ready=true;draw();
 }catch(e){state.ready=true;root.innerHTML=`<main class="setup"><div class="card"><h1>Error al conectar</h1><p>${esc(explain(e))}</p><button class="btn" data-act="retry">Reintentar</button></div></main>`;}
}
async function fetchHome(){
 const userId=state.user.id;
 const memberships=check(await sb.from('memberships').select('household_id,joined_at').eq('user_id',userId).order('joined_at',{ascending:true}).limit(1));
 const hid=memberships?.[0]?.household_id;
 if(!hid){state.home=null;state.members=[];state.chores=[];state.occ=[];return;}
 const after=addDays(today(),-130);
 const res=await Promise.all([
  sb.from('households').select('*').eq('id',hid).single(),
  sb.from('memberships').select('user_id,joined_at').eq('household_id',hid).order('joined_at'),
  sb.from('chores').select('*').eq('household_id',hid).order('created_at'),
  sb.from('occurrences').select('*').eq('household_id',hid).gte('occ_date',after),
  sb.from('notes').select('*').eq('household_id',hid).order('created_at',{ascending:false}).limit(20),
  sb.from('activity').select('*').eq('household_id',hid).order('created_at',{ascending:false}).limit(30)
 ]);
 for(const r of res)if(r.error)throw r.error;
 const [home,mem,chores,occ,notes,activity]=res.map(x=>x.data);
 const ids=mem.map(x=>x.user_id);
 const profiles=ids.length?check(await sb.from('profiles').select('id,display_name,emoji').in('id',ids)):[];
 state.home=home;state.members=mem.map(x=>({...x,...profiles.find(p=>p.id===x.user_id),id:x.user_id,display_name:profiles.find(p=>p.id===x.user_id)?.display_name||'Integrante'}));
 state.chores=chores;state.occ=occ;state.notes=notes;state.activity=activity;
}
async function action(fn,success){if(state.busy)return;state.busy=true;try{await fn();if(state.user)await fetchHome();draw();if(success)notify(success);}catch(e){notify(explain(e),true);}finally{state.busy=false}}
const me=()=>state.members.find(m=>m.id===state.user?.id)?.display_name||state.user?.user_metadata?.display_name||'Tú';
const taskList=(items,empty='No hay tareas para este día.')=>items.length?`<div class="tasks">${items.map(item=>{
 const c=item.chore,o=item.occ,complete=isDone(o);
 return `<div class="task${complete?' done':''}"><span class="emoji" aria-hidden="true">${emoji(c.category)}</span><div class="taskinfo"><strong>${esc(c.title)}</strong><small>${esc(nameOf(item.assignee))} · ${Number(c.minutes)} min · ${esc(c.priority)}${c.due_time?' · '+esc(c.due_time.slice(0,5)):''}${o?.status==='in_progress'?' · En curso':''}</small></div><div class="taskbuttons">${complete?`<button class="btn secondary small" data-act="undo" data-id="${c.id}" data-date="${item.day}">Deshacer</button>`:`<button class="btn secondary small" data-act="start" data-id="${c.id}" data-date="${item.day}">Iniciar</button><button class="btn small" data-act="done" data-id="${c.id}" data-date="${item.day}">✓ Listo</button>`}<button aria-label="Editar ${esc(c.title)}" class="btn secondary small" data-act="edit" data-id="${c.id}">✎</button></div></div>`;
 }).join('')}</div>`:`<div class="empty">🌿 <b>Todo despejado por ahora</b>${esc(empty)}</div>`;
const navEntries=[['hoy','☀️','Hoy'],['semana','📅','Agendar tareas'],['nueva','➕','Nueva'],['retos','🏆','Retos'],['nosotros','💛','Nosotros'],['ajustes','⚙️','Ajustes']];
function nav(isBottom=false){return `<nav aria-label="Navegación principal" class="${isBottom?'bottomnav':'nav'}">${navEntries.map(([v,e,label])=>`<button type="button" class="${state.tab===v?'active':''}" data-act="tab" data-tab="${v}"><span class="ico">${e}</span>${esc(label)}</button>`).join('')}</nav>`}
function wrap(content){return `<div class="page"><div class="topbar">${iconTitle('🏡','Misión Casa')}<span class="pill">${esc(state.home.name)}</span></div><div class="shell">${nav()}<section class="main" aria-live="polite">${content}</section></div></div>${nav(true)}`}
function todayPage(){const d=today(),items=agenda(state.chores,state.occ,d,state.members),amount=done(items).length,pct=items.length?Math.round(amount/items.length*100):0;const own=items.filter(i=>i.assignee===state.user.id),other=items.filter(i=>i.assignee!==state.user.id);return `<div class="eyebrow">¡Hola, ${esc(me())}! 👋</div><h1 class="title">Una casa en equipo<br>se siente mejor 💛</h1><p class="sub">Lo importante es avanzar juntos, paso a paso.</p><div class="hero"><div class="between"><strong>Progreso de hoy</strong><strong>${pct}%</strong></div><div class="statbar"><div style="width:${pct}%"></div></div><div class="between"><small>${amount} de ${items.length} tareas completadas</small><span>✨</span></div>${items.length>0&&pct===100?'<p style="margin:12px 0 0;font-weight:800">🎉 ¡Misión cumplida! ¡Gran trabajo en equipo!</p>':''}</div><div class="between"><h2>Hoy, ${esc(dayName(d))}</h2><button class="btn" data-act="new">+ Agregar tarea</button></div><div style="margin:16px 0"><button class="btn secondary wide" data-act="tab" data-tab="semana">📅 Agendar tareas para otro día</button></div><div class="section"><div class="sectionhead"><h2>🙋 Mis tareas</h2>${chip('Pendientes',own.filter(x=>!isDone(x.occ)).length)}</div>${taskList(own,'Puedes crear una nueva tarea con el botón superior.')}</div><div class="section"><div class="sectionhead"><h2>👫 De ${esc(state.members.find(x=>x.id!==state.user.id)?.display_name||'la pareja')}</h2>${chip('Pendientes',other.filter(x=>!isDone(x.occ)).length)}</div>${taskList(other,'Cuando inviten a otra persona verán sus tareas aquí.')}</div>`}
function weekPage(){const days=weekDays(state.date),items=agenda(state.chores,state.occ,state.date,state.members);return `<div class="eyebrow">Plan compartido</div><h1 class="title">📅 Agendar tareas</h1><p class="sub">Elige un día, agenda el aseo y reparte las tareas con anticipación. Las tareas compartidas rotan cada semana.</p><div class="between"><button class="btn secondary small" data-act="weekPrev">← Semana anterior</button><button class="btn secondary small" data-act="weekNow">Esta semana</button><button class="btn secondary small" data-act="weekNext">Siguiente →</button></div><div class="weekbar">${days.map((d,i)=>`<button data-act="date" data-date="${d}" class="${d===state.date?'selected':''}" aria-pressed="${d===state.date}"><span>${DAY_SHORT[i]}</span><b>${Number(d.slice(8))}</b></button>`).join('')}</div><div class="between"><h2>${esc(dayName(state.date))}</h2><button class="btn" data-act="new">+ Agendar tarea</button></div><div class="section">${taskList(items,'Selecciona un día o agrega una tarea recurrente.')}</div>`}
function formPage(){let c=state.editing||null;const templ=state.template!==null?TEMPLATES[state.template]:null;const title=c?.title||templ?.[0]||'',cat=c?.category||templ?.[1]||'Cocina',mins=c?.minutes||templ?.[2]||15,rec=c?.recurrence||templ?.[3]||'once',weekdays=c?.weekdays||templ?.[4]||[1,3,5],start=c?.start_date||state.date||today();return `<div class="eyebrow">Tu hogar a tu ritmo</div><h1 class="title">${c?'Editar tarea ✏️':'Agendar tarea 📅'}</h1><p class="sub">Cada pequeña tarea cuenta. Reparte el tiempo de forma justa.</p>${!c?`<div class="card"><h2>⚡ Ideas rápidas</h2><div class="templates">${TEMPLATES.map((t,i)=>`<button data-act="template" data-idx="${i}">${emoji(t[1])} ${esc(t[0])}</button>`).join('')}</div></div>`:''}<div class="card"><form data-form="task"><div class="formgrid"><div class="field full"><label for="title">¿Qué hay que hacer?</label><input class="input" id="title" name="title" maxlength="80" required placeholder="Ej. Lavar los platos" value="${esc(title)}"/></div><div class="field"><label for="cat">Área de la casa</label><select class="input" id="cat" name="category">${CATEGORIES.map(([id,e])=>`<option value="${esc(id)}" ${cat===id?'selected':''}>${e} ${esc(id)}</option>`).join('')}</select></div><div class="field"><label for="min">Minutos estimados</label><input class="input" id="min" name="minutes" type="number" min="1" max="480" required value="${Number(mins)}"/></div><div class="field"><label for="resp">Responsable</label><select class="input" id="resp" name="assignee"><option value="">🤝 Compartida (se alterna)</option>${state.members.map(m=>`<option value="${m.id}" ${c?.assignee_id===m.id?'selected':''}>${esc(m.display_name)}</option>`).join('')}</select></div><div class="field"><label for="repeat">Repetición</label><select class="input" id="repeat" name="recurrence"><option value="daily" ${rec==='daily'?'selected':''}>Todos los días</option><option value="weekdays" ${rec==='weekdays'?'selected':''}>Días específicos</option><option value="weekly" ${rec==='weekly'?'selected':''}>Una vez por semana</option><option value="monthly" ${rec==='monthly'?'selected':''}>Una vez al mes</option><option value="once" ${rec==='once'?'selected':''}>Una sola vez</option></select></div><div class="field full" id="weekdays" ${rec!=='weekdays'?'hidden':''}><span>¿Qué días?</span><div class="daychips">${['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map((d,i)=>`<label><input type="checkbox" name="weekday" value="${i+1}" ${(weekdays||[]).includes(i+1)?'checked':''}/><span>${d}</span></label>`).join('')}</div></div><div class="field"><label for="start">Fecha de inicio</label><input class="input" id="start" name="start_date" type="date" required value="${esc(start)}"/></div><div class="field"><label for="time">Hora (opcional)</label><input class="input" id="time" name="due_time" type="time" value="${esc((c?.due_time||'').slice(0,5))}"/></div><div class="field"><label for="diff">Dificultad</label><select class="input" id="diff" name="difficulty"><option value="1" ${Number(c?.difficulty ?? (templ && templ[2]>20?2:1))===1?'selected':''}>Fácil</option><option value="2" ${Number(c?.difficulty||2)===2?'selected':''}>Media</option><option value="3" ${Number(c?.difficulty||2)===3?'selected':''}>Difícil</option></select></div><div class="field"><label for="priority">Prioridad</label><select class="input" id="priority" name="priority"><option value="baja" ${c?.priority==='baja'?'selected':''}>Baja</option><option value="media" ${!c||c.priority==='media'?'selected':''}>Media</option><option value="alta" ${c?.priority==='alta'?'selected':''}>Alta</option></select></div><div class="field full"><label for="description">Notas (opcional)</label><textarea class="input" id="description" name="description" maxlength="300" placeholder="Detalles o acuerdos sobre esta tarea">${esc(c?.description||'')}</textarea></div></div><div class="space"></div><button class="btn wide" type="submit">${c?'Guardar cambios':'Agregar tarea al hogar'} 💛</button></form>${c?`<button class="btn danger wide" data-act="delete" data-id="${c.id}" style="margin-top:12px">Eliminar tarea</button>`:''}</div>`}
function retosPage(){const w=new Set(weekDays(today()));const week=state.occ.filter(o=>isDone(o)&&w.has(o.occ_date));const xpWeek=week.reduce((s,o)=>s+(o.xp||0),0);const total=state.occ.filter(isDone).reduce((s,o)=>s+(o.xp||0),0),goal=state.home.weekly_goal_xp||300;const t=agenda(state.chores,state.occ,today(),state.members).filter(x=>!isDone(x.occ));const exp=t.filter(x=>x.chore.minutes<=15);const firstWeek=total>0 && week.length>=5;return `<div class="eyebrow">Logros compartidos</div><h1 class="title">¡A por los retos! 🏆</h1><p class="sub">Sumamos puntos como equipo. Aquí nadie compite con su pareja.</p><div class="cards2"><div class="metric"><span>⚡ XP de esta semana</span><strong>${xpWeek}</strong><small>Meta ${goal} XP</small></div><div class="metric"><span>🏅 XP acumulado</span><strong>${total}</strong><small>Por todas las tareas terminadas</small></div></div><div class="space"></div><div class="progressline"><div class="fill" style="width:${Math.min(100,Math.round(xpWeek/goal*100))}%"></div></div><p class="hint">${Math.min(100,Math.round(xpWeek/goal*100))}% de la meta semanal</p><div class="section card"><h2>🎲 Hazlo entretenido</h2><p class="sub">Una misión al azar o un reto rápido pueden cambiar el día.</p><div class="flex" style="flex-wrap:wrap"><button class="btn" data-act="roulette" ${!t.length?'disabled':''}>🎲 Ruleta</button><button class="btn soft" data-act="express" ${!exp.length?'disabled':''}>⏱️ Reto de 15 min</button></div>${state.highlight?`<p class="tag" style="margin-top:16px">🎯 ${esc(state.highlight)}</p>`:''}${state.express?`<div class="section"><h3>Reto express: pendientes breves</h3>${taskList(exp.slice(0,5),'Todas las tareas breves están hechas.')}</div>`:''}</div><div class="card"><h2>🏅 Insignias de la casa</h2><div class="badgeRow"><span class="badgeItem ${firstWeek?'earned':''}">🌱 Semana activa</span><span class="badgeItem ${state.occ.filter(isDone).length>=5?'earned':''}">✨ 5 tareas</span><span class="badgeItem ${state.occ.filter(isDone).length>=20?'earned':''}">🏆 20 tareas</span></div><p class="hint">Las insignias se obtienen con tareas realmente completadas.</p></div>`}
function nosotrosPage(){const ws=weekStart(today()),minutes=Object.fromEntries(state.members.map(m=>[m.id,0]));state.occ.filter(o=>isDone(o)&&o.occ_date>=ws).forEach(o=>{if(o.completed_by in minutes)minutes[o.completed_by]+=o.minutes||0});const sum=Object.values(minutes).reduce((a,b)=>a+b,0);return `<div class="eyebrow">Más equipo, menos discusiones</div><h1 class="title">Nosotros 💛</h1><p class="sub">La colaboración se mide por tiempo, no por quién hace más tareas.</p><div class="card"><h2>Tiempo aportado esta semana</h2>${state.members.map(m=>`<div style="margin-bottom:18px"><div class="between"><strong>${esc(m.display_name)}</strong><strong>${minutes[m.id]} min</strong></div><div class="space"></div><div class="progressline"><div class="fill" style="width:${sum?Math.round(minutes[m.id]*100/sum):0}%"></div></div></div>`).join('')}<p class="hint">No es una competencia: sirve para encontrar un reparto más justo.</p></div><div class="card"><h2>💌 Gracias por ayudar</h2><p class="sub">Envía un agradecimiento que aparecerá en la actividad compartida.</p><form data-form="thanks"><div class="field"><label>Destinatario</label><select class="input" name="recipient" required>${state.members.filter(m=>m.id!==state.user.id).map(m=>`<option value="${m.id}">${esc(m.display_name)}</option>`).join('')}</select></div><div class="space"></div><div class="field"><label>Mensaje</label><input class="input" name="message" maxlength="150" value="Gracias por ayudar hoy. ¡Somos un gran equipo! 💛" required/></div><div class="space"></div><button class="btn" ${state.members.length<2?'disabled':''}>Enviar agradecimiento 💛</button>${state.members.length<2?'<p class="hint">Invita a tu pareja para activar esta función.</p>':''}</form></div><div class="card"><h2>📝 Notas para ambos</h2><form data-form="note"><textarea class="input" name="note" maxlength="500" required placeholder="Escribe un acuerdo o recordatorio visible para los dos"></textarea><div class="space"></div><button class="btn">Agregar nota</button></form>${state.notes.map(n=>`<div class="noteitem"><p>${esc(n.body)}</p><small class="muted">${esc(nameOf(n.author_id))}</small></div>`).join('')}</div><div class="card"><h2>🌿 Actividad reciente</h2>${state.activity.length?state.activity.slice(0,12).map(a=>`<p class="tiny">${esc(nameOf(a.actor_id))} ${esc(a.message)}</p>`).join(''):'<p class="sub">Aún no hay actividad.</p>'}</div>`}
function ajustesPage(){return `<div class="eyebrow">Personalización</div><h1 class="title">Nuestro hogar ⚙️</h1><div class="card"><h2>🏡 Ajustar hogar</h2><form data-form="home"><div class="field"><label>Nombre de la casa</label><input name="name" class="input" maxlength="80" required value="${esc(state.home.name)}"/></div><div class="space"></div><div class="field"><label>Nuestro acuerdo</label><textarea name="agreement" class="input" maxlength="400" required>${esc(state.home.agreement)}</textarea></div><div class="space"></div><div class="field"><label>Meta semanal de XP</label><input name="goal" class="input" type="number" min="50" max="10000" value="${state.home.weekly_goal_xp||300}" required/></div><div class="space"></div><button class="btn">Guardar ajustes</button></form></div><div class="card"><h2>👩‍❤️‍👨 Invitar a otra persona</h2><p class="sub">Dania debe crear su propia cuenta y elegir «Unirme con un código».</p><div class="between"><strong class="tag" style="font-size:23px;letter-spacing:.12em">${esc(state.home.invite_code)}</strong><button class="btn secondary" data-act="share">Compartir invitación</button></div><div class="space"></div><h3>Integrantes</h3>${state.members.map(m=>`<p>${esc(m.emoji||'🙂')} ${esc(m.display_name)}${m.id===state.user.id?' (tú)':''}</p>`).join('')}</div><div class="card"><h2>📋 Administrar tareas</h2>${state.chores.length?state.chores.map(c=>`<div class="templatecard"><div><b>${emoji(c.category)} ${esc(c.title)}</b><small>${esc(nameOf(c.assignee_id))} · ${c.minutes} min</small></div><button class="btn secondary small" data-act="edit" data-id="${c.id}">Editar</button></div>`).join(''):'<p class="sub">Aún no tienes tareas.</p>'}<button class="btn secondary wide" style="margin-top:17px" data-act="new">+ Nueva tarea</button></div><button class="btn danger wide" data-act="logout">Cerrar sesión</button>`}
function onboarding(){root.innerHTML=`<main class="authbg"><section class="authcard">${iconTitle('🏡','Misión Casa')}<h1>¡Bienvenido, ${esc(state.user?.user_metadata?.display_name||'') }!</h1><p class="sub">Crea un hogar o únete con el código que te compartan.</p><form data-form="createhome"><div class="field"><label>Crear nuestro hogar</label><input class="input" name="name" maxlength="80" required value="Nuestro hogar"/></div><button class="btn wide">Crear hogar</button></form><div class="divider"></div><form data-form="joinhome"><div class="field"><label>Unirme con un código</label><input class="input" name="code" maxlength="12" placeholder="ABC123" required/></div><button class="btn secondary wide">Unirme</button></form><div class="space"></div><button class="linkbtn" data-act="logout">Salir de esta cuenta</button></section></main>`}
function authPage(){root.innerHTML=`<main class="authbg"><section class="authcard">${iconTitle('🏡','Misión Casa')}<h1>${state.authMode==='signup'?'Crea tu cuenta':state.authMode==='forgot'?'Recuperar acceso':'Bienvenidos al hogar'}</h1><p class="sub">Una casa en equipo se siente mejor 💛</p><form data-form="auth">${state.authMode==='signup'?'<div class="field"><label>Tu nombre</label><input class="input" name="name" placeholder="Sergio o Dania" maxlength="30" required/></div>':''}<div class="field"><label>Correo electrónico</label><input class="input" name="email" type="email" autocomplete="email" required/></div>${state.authMode!=='forgot'?`<div class="field"><label>Contraseña</label><input class="input" name="password" type="password" minlength="${state.authMode==='signup'?12:6}" autocomplete="${state.authMode==='signup'?'new-password':'current-password'}" required/>${state.authMode==='signup'?'<small class="hint">Mínimo 12 caracteres, elige una contraseña única y difícil de adivinar.</small>':''}</div>`:''}<button class="btn wide" ${state.busy?'disabled':''}>${state.authMode==='signup'?'Crear cuenta':state.authMode==='forgot'?'Enviar correo de recuperación':'Entrar a mi hogar'}</button></form><div class="authlinks">${state.authMode!=='signup'?'<button class="linkbtn" data-act="authMode" data-mode="signup">Crear cuenta</button>':''}${state.authMode!=='login'?'<button class="linkbtn" data-act="authMode" data-mode="login">Ya tengo cuenta</button>':''}${state.authMode==='login'?'<button class="linkbtn" data-act="authMode" data-mode="forgot">Olvidé mi contraseña</button>':''}</div></section></main>`}
function draw(){if(!state.user){authPage();return}if(!state.home){onboarding();return}const page={hoy:todayPage,semana:weekPage,nueva:formPage,retos:retosPage,nosotros:nosotrosPage,ajustes:ajustesPage}[state.tab]||todayPage;root.innerHTML=wrap(page());}
function taskById(id){return state.chores.find(t=>t.id===id)}
function setTab(tab){state.tab=tab;if(tab!=='nueva'){state.editing=null;state.template=null}draw();window.scrollTo({top:0,behavior:'smooth'})}
root.addEventListener('change',e=>{if(e.target.name==='recurrence'){const week=document.querySelector('#weekdays');if(week)week.hidden=e.target.value!=='weekdays'}});
root.addEventListener('click',async e=>{
 const btn=e.target.closest('[data-act]');if(!btn)return;
 const a=btn.dataset.act,id=btn.dataset.id,day=btn.dataset.date;
 if(a==='retry'){loading();await hydrate();return;}
 if(a==='authMode'){state.authMode=btn.dataset.mode;draw();return;}
 if(a==='tab'){setTab(btn.dataset.tab);return;}
 if(a==='new'){state.editing=null;state.template=null;setTab('nueva');return;}
 if(a==='edit'){state.editing=taskById(id);state.template=null;state.tab='nueva';draw();return;}
 if(a==='template'){state.template=Number(btn.dataset.idx);state.editing=null;draw();return;}
 if(a==='date'){state.date=day;draw();return;}
 if(a==='weekPrev'||a==='weekNext'){state.date=addDays(state.date,a==='weekPrev'?-7:7);draw();return;}
 if(a==='weekNow'){state.date=today();draw();return;}
 if(a==='logout'){await action(async()=>{check(await sb.auth.signOut());state.user=null;state.home=null;state.authMode='login';},'Sesión cerrada');return;}
 if(a==='share'){const invite=`Únete a nuestro hogar en Misión Casa 🏡\nCódigo: ${state.home.invite_code}\nAbre la app y elige «Unirme con un código».`;if(navigator.share){try{await navigator.share({title:'Misión Casa',text:invite,url:APP_URL})}catch{}}else if(navigator.clipboard){try{await navigator.clipboard.writeText(invite+'\n'+APP_URL);notify('Invitación copiada para compartir 💛')}catch{notify(invite)}}else notify(invite);return;}
 if(a==='roulette'){const items=agenda(state.chores,state.occ,today(),state.members).filter(i=>!isDone(i.occ));if(items.length){state.highlight=items[Math.floor(Math.random()*items.length)].chore.title;draw();}return;}
 if(a==='express'){state.express=!state.express;draw();return;}
 if(a==='delete'){const c=taskById(id);if(!c||!confirm(`¿Eliminar la tarea «${c.title}» y su historial? Esta acción no se puede deshacer.`))return;await action(async()=>{check(await sb.from('chores').delete().eq('id',c.id).eq('household_id',state.home.id));state.tab='hoy';state.editing=null;},'Tarea eliminada');return;}
 if(['start','done','undo'].includes(a)){
  const c=taskById(id);if(!c)return;
  await action(async()=>{
   if(a==='undo'){check(await sb.from('occurrences').delete().eq('chore_id',c.id).eq('occ_date',day).eq('household_id',state.home.id));return;}
   const payload={household_id:state.home.id,chore_id:c.id,occ_date:day,updated_at:new Date().toISOString()};
   if(a==='start'){Object.assign(payload,{status:'in_progress',started_by:state.user.id});}
   if(a==='done'){Object.assign(payload,{status:'done',completed_by:state.user.id,completed_at:new Date().toISOString(),minutes:c.minutes,xp:xp(c)});}
   check(await sb.from('occurrences').upsert(payload,{onConflict:'chore_id,occ_date'}));
   if(a==='done')await sb.from('activity').insert({household_id:state.home.id,actor_id:state.user.id,kind:'done',message:`completó «${c.title}»`});
  },a==='done'?'¡Bien hecho! 💛':a==='undo'?'La tarea vuelve a pendiente':'¡Manos a la obra!');return;
 }
});
root.addEventListener('submit',async e=>{
 const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const f=new FormData(form),kind=form.dataset.form;
 if(kind==='auth'){
  const email=String(f.get('email')).trim(),password=String(f.get('password')||'');
  if(kind==='auth'&&state.authMode==='signup'&&password.length<12){notify('Elige una contraseña nueva de al menos 12 caracteres.',true);return;}
  await action(async()=>{
   if(state.authMode==='login'){check(await sb.auth.signInWithPassword({email,password}));state.user=(await sb.auth.getUser()).data.user;await fetchHome();return;}
   if(state.authMode==='signup'){const ret=await sb.auth.signUp({email,password,options:{data:{display_name:String(f.get('name')||'').trim()},emailRedirectTo:APP_URL}});check(ret);if(ret.data.session){state.user=ret.data.user;await fetchHome();}else notify('Cuenta creada. Revisa tu correo y confirma tu dirección antes de entrar.');return;}
   check(await sb.auth.resetPasswordForEmail(email,{redirectTo:APP_URL}));notify('Revisa tu correo para recuperar tu contraseña.');
  });return;
 }
 if(kind==='createhome'||kind==='joinhome'){
  await action(async()=>{check(await sb.rpc(kind==='createhome'?'create_household':'join_household',kind==='createhome'?{_name:String(f.get('name')).trim()}:{_code:String(f.get('code')).trim().toUpperCase()}));},kind==='createhome'?'¡Hogar creado! 🏡':'¡Te uniste al hogar! 💛');return;
 }
 if(kind==='task'){
  const title=String(f.get('title')||'').trim(),minutes=Number(f.get('minutes')),recur=String(f.get('recurrence'));
  const weekdays=f.getAll('weekday').map(Number);
  if(!title||!Number.isInteger(minutes)||minutes<1||minutes>480){notify('Completa el nombre y selecciona entre 1 y 480 minutos.',true);return;}
  if(recur==='weekdays'&&!weekdays.length){notify('Selecciona al menos un día de la semana.',true);return;}
  const data={household_id:state.home.id,title,description:String(f.get('description')||''),category:String(f.get('category')),minutes,difficulty:Number(f.get('difficulty')),priority:String(f.get('priority')),assignee_id:String(f.get('assignee')||'')||null,recurrence:recur,weekdays:recur==='weekdays'?weekdays:[],start_date:String(f.get('start_date')),due_time:String(f.get('due_time')||'')||null,active:true};
  await action(async()=>{if(state.editing){check(await sb.from('chores').update(data).eq('id',state.editing.id).eq('household_id',state.home.id));}else{check(await sb.from('chores').insert({...data,created_by:state.user.id}));}state.tab='hoy';state.template=null;state.editing=null;},state.editing?'Tarea actualizada':'¡Nueva tarea agregada! ✨');return;
 }
 if(kind==='home'){await action(async()=>{check(await sb.from('households').update({name:String(f.get('name')).trim(),agreement:String(f.get('agreement')).trim(),weekly_goal_xp:Number(f.get('goal'))}).eq('id',state.home.id))},'Ajustes guardados');return;}
 if(kind==='thanks'){await action(async()=>{check(await sb.from('activity').insert({household_id:state.home.id,actor_id:state.user.id,kind:'thanks',to_user:String(f.get('recipient')),message:String(f.get('message')).trim()}));},'Agradecimiento compartido 💛');return;}
 if(kind==='note'){await action(async()=>{check(await sb.from('notes').insert({household_id:state.home.id,author_id:state.user.id,body:String(f.get('note')).trim()}))},'Nota guardada para ambos');}
});
if(sb){sb.auth.onAuthStateChange((_event,session)=>{const id=session?.user?.id||null;if(id!==state.user?.id&&state.ready){loading();Promise.resolve().then(hydrate);}});window.addEventListener('focus',()=>{if(state.user&&!state.busy)fetchHome().then(draw).catch(()=>{})});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.user&&!state.busy)fetchHome().then(draw).catch(()=>{})});}
loading();hydrate();
</script>
